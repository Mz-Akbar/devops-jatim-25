version: "3.3"

services:
  leantime_db:
    image: mysql:8.4
    container_name: mysql_leantime
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    env_file: ./.env
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci

  leantime:
    image: leantime/leantime:latest
    container_name: leantime
    restart: unless-stopped
    env_file: ./.env
    networks:
      - leantime-net
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
    ports:
      - "${LEAN_PORT}:8080"
    depends_on:
      - leantime_db

volumes:
  db_data: "leantime_db_data"
  userfiles: "leantime_userfiles"
  public_userfiles: "leantime_public_userfiles"
  plugins: "leantime_plugins"

networks:
  leantime-net:
    driver: bridge