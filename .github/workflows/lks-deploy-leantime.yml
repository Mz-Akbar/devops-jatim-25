name: Leantime

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - leantime/**
      - .github/workflows/example-deploy-leantime.yml

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "lks-leantime"
  ECS_CLUSTER: "lks-oss-cluster"
  TOKEN: ${{ secrets.TOKENS}}

  ECS_LEANTIME_SERVICE: "leantime-service"
  LEANTIME_TASK_DEFINITION: "leantime/task-definition.json"
  LEANTIME_URL: " ${{ secrets.ALB_ENDPOINT }} "


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Leantime App
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

    

      - name: Update ECS task definition
        run: |
          sed -i "s|<task-def-image>|$IMAGE_FULL_URI|g" $LEANTIME_TASK_DEFINITION
          echo "Task definition updated."
          cat $LEANTIME_TASK_DEFINITION

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ env.LEANTIME_TASK_DEFINITION }}
          service: ${{ env.ECS_LEANTIME_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true
          run-task-tags: '[{"key": "Leantime", "value": "Leantime App"}'
