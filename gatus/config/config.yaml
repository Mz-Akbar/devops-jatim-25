alerting:
  github:
    token: "${TOKEN}"

endpoints:
  - name: Leantime
    url: <leantime-url> 
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 300"
    alerts:
      - type: github
        description: "Sensei, Leantime is down! Please check and fix it."

  - name: Gatus
    url: <gatus-url> 
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"
    alerts:
      - type: github
        failureThreshold: 3
        successThreshold: 5
        send-on-resolved: true
        description: "Sensei, Gatus is down! Please check and fix it."
