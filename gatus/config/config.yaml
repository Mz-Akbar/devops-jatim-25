alerting:
  github:
    token: "<github-token>"
    owner: Mz-Akbar
    repo: devops-jatim-25



endpoints:
  - name: Leantime
    url: <leantime-url> 
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 300"
    alerts:
      - type: github
        description: "Sensei, Leantime is down! Please check and fix it."
        failure-threshold: 3
        success-threshold: 5
        send-on-resolved: true
        title: "⚠️ Alert - Leantime is down"
        description: |
          Gatus detected an issue with Leantime:
          - Status: {{STATUS}}
          - Condition: {{CONDITION}}
          - Timestamp: {{TIMESTAMP}}

  - name: Gatus
    url: <gatus-url>
    interval: 1m
    conditions: 
      - "[STATUS] == 200"
      - "[RESPONS_TIME] < 500"
    alerts:
      - type: github
        failureThreshold: 3
        successThreshold: 5
        send-on-resolved: true
        description: "Sensei, Gatus is down! Please check and fix it."
        title: "⚠️ Alert - Gatus is down"
        description: |
          Gatus detected an issue with Gatus:
          - Status: {{STATUS}}
          - Condition: {{CONDITION}}
          - Timestamp: {{TIMESTAMP}}


