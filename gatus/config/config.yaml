alerting:
  github: 
    owner: "Mz-Akbar"
    repository: "devops-jatim-25"
    token: "${{ secret.TOKEN }}" 


endpoints:
  - name: Leantime
    url: $ {{ secret.LEANTIME_URL }} 
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 300"
    alerts:
      - type: github
        description: "Sensei, Leantime is down! Please check and fix it."

  - name: Gatus
    url: $ {{ secret.GATUS_URL}} 
    interval: 1m
    conditions: 
      - "[STATUS] == 200"
      - "[RESPONS_TIME] < 500"
    alerts:
      - type: github
        failureThreshold: 3
        successThreshold: 5
        send-on-resolved: true
        description: "Sensei, Gatus is down! Please check and fix it."


